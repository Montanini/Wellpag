# Ambiente de produção — roda na máquina do professor com IP fixo.
# As 7 URLs de serviço (wellpag.services.*) já vêm de variável de ambiente com
# fallback de dev no yml base — em produção o docker-compose.prod.yml passa
# cada uma apontando para o hostname interno do serviço na rede do compose
# (ex.: RELATORIO_SERVICE_URL=http://relatorio-service:8091), então não há
# nada de sensível ou específico de produção para sobrescrever aqui além do log.

logging:
  level:
    root: WARN
    com.wellpag: INFO
