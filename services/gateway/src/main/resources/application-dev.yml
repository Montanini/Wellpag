# Ambiente de desenvolvimento local
# As URLs dos 7 microsservicos vem de application.yml (wellpag.services.*),
# que ja usa localhost como default e aceita override via env var
# (RELATORIO_SERVICE_URL, AUTH_SERVICE_URL, etc). Nao hardcodar aqui de novo:
# um profile-specific file tem precedencia sobre application.yml, entao um
# valor fixo aqui anularia o override por env var usado pelo docker-compose
# (que aponta para o hostname de cada container, ex. http://auth-service:8092,
# em vez de localhost) - so o cenario "rodando sem Docker" (ver tabela no
# CLAUDE.md raiz) depende do default localhost de application.yml. O monolito
# (backend/) nao e mais roteado pelo gateway - ver comentario em RouteConfig
# sobre a remocao da rota /webhook/**.

server:
  port: 8080

logging:
  level:
    root: INFO
    com.wellpag.gateway: DEBUG
