version: '3.8'

# Infraestrutura compartilhada pelos profiles dev/teste/prod (Mongo + Evolution API)
# Uso: docker compose up -d

services:

  mongodb:
    image: mongo:7
    container_name: wellpag-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  evolution-api:
    image: atendai/evolution-api:latest
    container_name: wellpag-evolution
    ports:
      - "8081:8080"
    environment:
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=wellpag-local-key
      - DATABASE_ENABLED=false
      - QRCODE_LIMIT=10
    volumes:
      - evolution_data:/evolution/instances

  relatorio-service:
    build:
      context: ./services/relatorio-service
    container_name: wellpag-relatorio-service
    ports:
      - "8091:8091"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/wellpag_dev
    depends_on:
      - mongodb

  auth-service:
    build:
      context: ./services/auth-service
    container_name: wellpag-auth-service
    ports:
      - "8092:8092"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/wellpag_dev
      # Google OAuth2 nao tem default no application.yml (mesmo padrao do monolito) —
      # precisa vir do ambiente do host mesmo em dev.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      - mongodb

  aluno-service:
    build:
      context: ./services/aluno-service
    container_name: wellpag-aluno-service
    ports:
      - "8093:8093"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/wellpag_dev
      - AGENDA_SERVICE_URL=http://agenda-service:8094
      - FINANCEIRO_SERVICE_URL=http://financeiro-service:8095
    depends_on:
      - mongodb
      - agenda-service
      - financeiro-service

  agenda-service:
    build:
      context: ./services/agenda-service
    container_name: wellpag-agenda-service
    ports:
      - "8094:8094"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/wellpag_dev
    depends_on:
      - mongodb

  financeiro-service:
    build:
      context: ./services/financeiro-service
    container_name: wellpag-financeiro-service
    ports:
      - "8095:8095"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/wellpag_dev
    depends_on:
      - mongodb

  pagamento-service:
    build:
      context: ./services/pagamento-service
    container_name: wellpag-pagamento-service
    ports:
      - "8096:8096"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/wellpag_dev
    depends_on:
      - mongodb

  notificacao-service:
    build:
      context: ./services/notificacao-service
    container_name: wellpag-notificacao-service
    ports:
      - "8097:8097"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/wellpag_dev
      - FINANCEIRO_SERVICE_URL=http://financeiro-service:8095
    depends_on:
      - mongodb
      - financeiro-service

  gateway:
    build:
      context: ./services/gateway
    container_name: wellpag-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - RELATORIO_SERVICE_URL=http://relatorio-service:8091
      - AUTH_SERVICE_URL=http://auth-service:8092
      - ALUNO_SERVICE_URL=http://aluno-service:8093
      - AGENDA_SERVICE_URL=http://agenda-service:8094
      - FINANCEIRO_SERVICE_URL=http://financeiro-service:8095
      - PAGAMENTO_SERVICE_URL=http://pagamento-service:8096
      - NOTIFICACAO_SERVICE_URL=http://notificacao-service:8097
    depends_on:
      - relatorio-service
      - auth-service
      - aluno-service
      - agenda-service
      - financeiro-service
      - pagamento-service
      - notificacao-service

volumes:
  mongo_data:
  evolution_data:
