spring:
  application:
    name: financeiro-service

  data:
    mongodb:
      uri: ${MONGODB_URI}

server:
  port: 8095

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

wellpag:
  jwt:
    secret: ${JWT_SECRET}
  mensalidade:
    scheduler-cron: ${MENSALIDADE_CRON:0 5 0 1 * *}  # Todo dia 1º do mês às 00h05
