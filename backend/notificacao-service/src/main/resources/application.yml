spring:
  application:
    name: notificacao-service

  data:
    mongodb:
      uri: ${MONGODB_URI}

server:
  port: 8097

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

wellpag:
  jwt:
    secret: ${JWT_SECRET}
  webhook:
    base-url: ${WEBHOOK_BASE_URL:http://localhost:8080}
  whatsapp:
    evolution-api-url: ${EVOLUTION_API_URL:http://localhost:8081}
    evolution-api-key: ${EVOLUTION_API_KEY:}
    scheduler-cron: ${WHATSAPP_CRON:0 0 9 * * *}   # Todo dia às 09h
  financeiro-service:
    base-url: ${FINANCEIRO_SERVICE_URL:http://localhost:8095}
