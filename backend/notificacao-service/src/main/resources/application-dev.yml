# Ambiente de desenvolvimento local
# Valores fake, seguro versionar — nenhuma credencial real aqui.
# Mesmo banco (wellpag_dev) e mesmo segredo JWT do monolito (backend/application-dev.yml)
# nesta fase transitoria: mesmas collections "notificacoes_pagamento",
# "configuracoes_whatsapp" e "lembretes_enviados", e tokens emitidos pelo
# monolito continuam validos aqui.

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/wellpag_dev

server:
  port: 8097

wellpag:
  jwt:
    secret: dev-fake-secret-nao-usar-em-producao-min-256-bits-0000000000000000
  webhook:
    base-url: http://localhost:8080
  whatsapp:
    evolution-api-url: http://localhost:8081
    evolution-api-key: wellpag-local-key
    scheduler-cron: 0 0 9 * * *
  financeiro-service:
    base-url: ${FINANCEIRO_SERVICE_URL:http://localhost:8095}

logging:
  level:
    root: INFO
    com.wellpag.notificacao: DEBUG
